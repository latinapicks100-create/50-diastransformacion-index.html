<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>50 Días de Transformación</title>
<style>
body{margin:0;font-family:Georgia,serif;background:#f8f2eb;color:#5b4a3f}
.card{max-width:900px;margin:auto;padding:24px}
.login,.app{padding:20px}
.box{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:16px}
input,textarea,select{width:100%;padding:10px;margin-top:8px;border:1px solid #ddd;border-radius:10px}
button{background:#b8925a;color:white;border:none;padding:12px 18px;border-radius:12px}
h1,h2{color:#9c7a45}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<div id="login" class="login box">
<h1>💛 50 Días de Transformación</h1>
<p>PIN de acceso</p>
<input id="pin" type="password" placeholder="1710">
<button onclick="enter()">Entrar</button>
</div>

<div id="app" class="hidden">
<div class="box">
<h2>Dashboard</h2>
<p>Día: <input id="dia" type="number" min="1" max="50" value="1"></p>
<p>Estado emocional:
<select id="mood"><option>😊</option><option>😌</option><option>😐</option><option>😔</option></select>
</p>
</div>

<div class="box">
<h2>✨ Pregunta del día</h2>
<p id="q">¿Qué más es posible hoy?</p>
</div>

<div class="box">
<h2>🌅 Intención</h2>
<textarea id="intencion"></textarea>
</div>

<div class="box">
<h2>🙏 Gratitud</h2>
<textarea id="gratitud"></textarea>
</div>

<div class="box">
<h2>📈 Trading & Abundancia</h2>
<input id="inicial" placeholder="Balance inicial">
<input id="actual" placeholder="Balance actual">
<textarea id="trading" placeholder="Lección del día"></textarea>
</div>

<div class="box">
<h2>🌟 Manifestaciones</h2>
<textarea id="mani"></textarea>
</div>

<div class="box">
<button onclick="save()">Guardar</button>
</div>
</div>
</div>

<script>
function enter(){
 if(document.getElementById('pin').value==='1710'){
   login.classList.add('hidden');
   app.classList.remove('hidden');
   load();
 } else alert('PIN incorrecto');
}
function save(){
 const data={
 dia:dia.value,mood:mood.value,intencion:intencion.value,
 gratitud:gratitud.value,inicial:inicial.value,
 actual:actual.value,trading:trading.value,mani:mani.value
 };
 localStorage.setItem('transformacion50',JSON.stringify(data));
 alert('Guardado');
}
function load(){
 const d=JSON.parse(localStorage.getItem('transformacion50')||'null');
 if(!d)return;
 for(let k in d){ if(document.getElementById(k)) document.getElementById(k).value=d[k];}
}
</script>
</body>
</html>
