
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>50 Días de Transformación Premium</title>
<style>
body{margin:0;background:#f7f1ea;color:#5b4a3f;font-family:Georgia,serif}
.container{max-width:1000px;margin:auto;padding:20px}
.card{background:#fff;border-radius:20px;padding:20px;margin:15px 0;box-shadow:0 4px 14px rgba(0,0,0,.08)}
h1,h2{color:#b8925a}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-top:8px}
button{background:#b8925a;color:#fff;border:none;padding:12px 18px;border-radius:12px}
.hidden{display:none}
.progress{height:12px;background:#eee;border-radius:10px;overflow:hidden}
.fill{height:100%;background:#b8925a;width:2%}
.question{background:#faf6f0;padding:12px;border-radius:12px;margin:10px 0}
</style>
</head>
<body>
<div class="container">

<div id="login" class="card">
<h1>💛 50 Días de Transformación</h1>
<p>PIN 1710</p>
<input id="pin" type="password">
<button onclick="enter()">Entrar</button>
</div>

<div id="app" class="hidden">

<div class="card">
<h2>📊 Dashboard</h2>
<label>Día</label>
<input id="dia" type="number" min="1" max="50" value="1" onchange="updateDay()">
<div class="progress"><div id="fill" class="fill"></div></div>
<p id="progressText">Día 1 de 50</p>
</div>

<div class="card">
<h2>😊 Estado emocional</h2>
<select id="mood">
<option>😊</option><option>😌</option><option>🙂</option><option>😐</option><option>😔</option>
</select>
</div>

<div class="card">
<h2>✨ Preguntas Expansivas</h2>
<div id="questions"></div>
</div>

<div class="card">
<h2>🌅 Intención del día</h2>
<textarea id="intencion"></textarea>
</div>

<div class="card">
<h2>🙏 Gratitud</h2>
<textarea id="gratitud"></textarea>
</div>

<div class="card">
<h2>❤️ Amor propio</h2>
<textarea id="amor"></textarea>
</div>

<div class="card">
<h2>📈 Trading & Abundancia</h2>
<input id="inicial" placeholder="Balance inicial">
<input id="actual" placeholder="Balance actual">
<textarea id="trading" placeholder="Lección del día"></textarea>
</div>

<div class="card">
<h2>🌟 Manifestaciones</h2>
<textarea id="mani"></textarea>
</div>

<div class="card">
<button onclick="save()">Guardar</button>
</div>

</div>
</div>

<script>
const preguntas=[
["¿Qué más es posible hoy?","¿Qué elegiría si no tuviera miedo?","¿Qué deseo manifestar?"],
["¿Qué puedo recibir hoy?","¿Dónde me limito?","¿Cómo puede mejorar esto?"],
["¿Qué energía puedo ser hoy?","¿Qué oportunidad no estoy viendo?","¿Qué versión de mí está emergiendo?"],
["¿Qué puedo soltar?","¿Qué me expandiría?","¿Qué acción inspirada puedo tomar?"],
["¿Cómo actuaría mi yo abundante?","¿Qué está funcionando?","¿Qué puedo agradecer antes de recibir?"]
];

function enter(){
 if(pin.value==='1710'){
   login.classList.add('hidden');
   app.classList.remove('hidden');
   updateDay();load();
 } else alert('PIN incorrecto');
}

function updateDay(){
 let d=parseInt(dia.value||1);
 fill.style.width=(d/50*100)+'%';
 progressText.textContent='Día '+d+' de 50';
 let q=preguntas[(d-1)%preguntas.length];
 questions.innerHTML=q.map(x=>'<div class="question">'+x+'<textarea></textarea></div>').join('');
}

function save(){
 const data={dia:dia.value,mood:mood.value,intencion:intencion.value,gratitud:gratitud.value,amor:amor.value,inicial:inicial.value,actual:actual.value,trading:trading.value,mani:mani.value};
 localStorage.setItem('transformacion50premium',JSON.stringify(data));
 alert('Guardado 💛');
}
function load(){
 const d=JSON.parse(localStorage.getItem('transformacion50premium')||'null');
 if(!d)return;
 Object.keys(d).forEach(k=>{if(document.getElementById(k))document.getElementById(k).value=d[k]});
 updateDay();
}
</script>
</body>
</html>
